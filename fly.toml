app = 'subnauewallet'
primary_region = 'sin'

[build]

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 2
  processes = ['app']

[[vm]]
  size = 'performance-6x'
  memory = '16gb'
  cpu_kind = 'performance'
  cpus = 6
  memory_mb = 16384
