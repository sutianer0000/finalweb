; OPcache — production tuning for PHP 8.2 on Apache.
; Compiled bytecode is held in shared memory so subsequent requests skip
; lex+parse+compile entirely. Easily 2-3x throughput vs. unconfigured PHP.

opcache.enable=1
opcache.enable_cli=0

; Memory pool. Bump if "opcache_get_status()" shows used_memory near the cap.
opcache.memory_consumption=128
opcache.interned_strings_buffer=16

; Number of cacheable scripts. Project has well under 1k files; 4k is roomy.
opcache.max_accelerated_files=4000

; Production: don't restat files on every request. The container is
; immutable; redeploys produce a new image, which restarts PHP, which
; resets OPcache. Set both to disable runtime checks entirely.
opcache.validate_timestamps=0
opcache.revalidate_freq=0

; Faster path resolution — small win, no downside in our setup.
opcache.save_comments=1
opcache.fast_shutdown=1
